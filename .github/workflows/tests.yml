name: Regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.10', aioquic: '1.3.0' }
          - { os: windows-latest, python: '3.10', aioquic: '1.3.0' }
          - { os: ubuntu-latest, python: '3.12', aioquic: '1.7.0' }
          - { os: windows-latest, python: '3.12', aioquic: '1.7.0' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt "av==15.0.0" "aiohttp==3.13.2" "cryptography==46.0.5" "aioquic==${{ matrix.aioquic }}"
      - run: ruff check .
      - run: python -m pytest -q
      - run: node --check relay/web/app.js
      - run: python tests/run_integration.py e2e-tls --synthetic
      - run: python tests/run_integration.py quic --synthetic
